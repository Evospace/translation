[research_descriptions]
MineralsScan=A survey of the ground around the landing site. Stone, coal and copper ore go into fuel, furnaces and building material.
Electricity=The basics of electric current. Leads to the first generators.
PowerGeneration=Heat turns into rotation, rotation turns into electricity. A Stirling engine and a compact generator make the first power plant.
PowerTransmission=Cables carry electricity from generators to machines.
Smelting=Ore melted in a stone smelter. Gives copper, glass and gold.
Metalwork=Copper ingots shaped into parts. Every machine is built from parts.
DistributedComputing=Computers create research points. More computers make research faster.
SingleTypeStorage=An item rack holds a large stock of one item type.
InventoryUpgrade=More slots in the player inventory.
MetalBlocks=Building blocks cast from metal.
SteelProduction=A blast furnace smelts steel. Steel parts and pipes go into the machines of the next tier.
AdvancedSmelting=An arc smelter reaches the heat stainless steel needs.
Railway=Rails, stations and trains carry cargo between distant parts of the factory.
RailSignals=Signals split a line into blocks, so several trains share one track.
Roadwork=Road cones and barriers mark paths and work areas.
MetalDoors=Sliding and lift doors.
FluidTransfer=Pipes carry fluids and gases between machines.
HeatTransferring=Heat pipes carry heat from a furnace to the machines that use it.
DecorativePaint=Blocks in solid colors and metal finishes.
BasicMachines=An automatic hammer and a macerator. Ore becomes gravel, ingots become plates, plates become dust.
Automatization=Robot arms, conveyors and splitters. Machines pass items to each other without the player.
AutomaticMining=A drilling rig mines ore and stone on its own. Deposits are marked on the map.
Designable=Stairs, corners, beams and scaffolds.
DecorativeWood=Wooden planks for building.
LogicNetworking=Logic wires carry signals between devices.
LogicDevices=Buttons, pressure plates, screens and transceivers send and show signals.
SulfurSynthesis=Sulfur extracted from heavy oil. It burns as fuel and goes into sulfuric acid.
SulfuricAcidSynthesis=Sulfur, water and a catalyst give sulfuric acid.
Fermentation=A fermenter turns organic matter into fluids and gases.
PreciseTemperaturePyrolysis=Raw oil broken down at a set temperature. Each temperature gives its own product: heavy oil, diesel, gasoline or ethylene.
FuelChemistry=Hydrocarbon and oxidizer blends mix into rocket fuel.
DecorativePlastic=Plastic windows.
AluminiumReduction=Electrolysis reduces aluminium oxide to aluminium.
AluminiumProduction=Aluminium parts, pipes and foil for the machines of the next tier.
AdvancedAlloys=Iron and chromium dust mix into stainless steel dust.
StainlessSteelProduction=Stainless steel parts and pipes. The steel resists acids and heat.
IndustrialSmelting=An industrial smelter for titanium, tantalum and large batches of steel.
IndustrialSteelProduction=Iron and coal dust blown with oxygen turn straight into steel plates.
KrollProcess=Titanium oxide is chlorinated into titanium tetrachloride, which aluminium reduces to titanium sponge.
TitaniumProduction=Titanium parts and pipes. A strong, light metal for the machines of the next tier.
CrudeTantalum=Tantalum smelted from dust and sludge, then drawn into wire and rolled into foil.
FastSifting=Impure gravel sifted in larger batches. Each batch gives ore dust and a crystal.
ReactionThrottling=Three control cells hold one uranium cell at a quarter of the reactor's power.
AdvancedReflection=A denser reactor load: three uranium cells under one control cell.
ThoriumReaction=Thorium in the reactor breeds uranium-233, which burns as fuel.
PlutoniumReaction=Plutonium cells as fuel for the fission reactor.
FusionReaction=Synthesis cells and antimatter give neutronium in the fusion reactor.
NeutroniumProduction=Neutronium parts and pipes, the last material of the tree.
RegenerativeFurnace=Exhaust gas heats the incoming air, so the furnace runs hotter on the same fuel. Steel furnaces and smelters.
MagnesiteRefractories=A magnesite brick lining stands more heat than fireclay. Aluminium furnaces and smelters.
InductionMelting=An alternating magnetic field heats the metal from inside, without flame. Stainless steel furnaces and smelters.
VacuumArcRemelting=Remelting in vacuum removes gases and impurities from the metal. Titanium furnaces and smelters.
PlasmaSpraying=A plasma jet sprays a heat-resistant coating onto furnace walls. Composite furnaces and smelters.
LevitationMelting=A magnetic field holds the melt in the air, away from the crucible walls. Neutronium furnaces.
ElectronBeamMelting=An electron beam melts metal in vacuum. Neutronium electric furnace and smelters.
InterchangeableParts=Parts made to one standard fit any machine of a series. Steel macerators, automatic hammers, pumps and constructors.
BallBearings=Shafts turn on balls instead of sliding. Aluminium processing machines.
CementedCarbide=Tungsten carbide tools cut and grind hard ore. Stainless steel macerators, automatic hammers, mixers, assemblers and constructors.
FrothFlotation=Air bubbles lift ore particles and leave waste rock behind. Stainless steel sifters, separators and ore washers.
NumericalControl=Machines follow a program instead of an operator. Titanium macerators, automatic hammers, mixers, assemblers and constructors.
MagneticSeparation=A magnetic field pulls ore grains out of waste rock. Titanium sifters, separators and ore washers.
LaserCutting=A laser beam cuts parts to exact shape. Composite macerators, automatic hammers, mixers, assemblers and constructors.
XRaySorting=X-rays tell ore from waste rock, and an air jet knocks the waste aside. Composite sifters, separators and ore washers.
MolecularAssembly=Matter assembled molecule by molecule. Neutronium macerators, automatic hammers, mixers, assemblers and constructors.
IsotopeSeparation=Atoms sorted by mass in a magnetic field. Neutronium sifters, separators and ore washers.
WaterTubeBoiler=Water runs in tubes through the fire and boils faster at higher pressure. Aluminium boilers, steam engines and kinetic heaters.
SuperheatedSteam=Steam heated above its boiling point carries more energy. Stainless steel boilers, steam engines and turbines.
Superalloys=Nickel alloys keep their strength at turbine temperatures. Titanium boilers, steam engines and turbines.
SupercriticalSteam=Above the critical point, water and steam are one phase. Composite industrial boilers, industrial turbines and reactors.
CeramicComposites=Ceramic fibers in a ceramic matrix keep their shape where metal melts. Composite kinetic heaters, boilers, steam engines and turbines.
Magnetohydrodynamics=Hot conducting gas passing through a magnetic field gives current directly. Neutronium industrial boilers, industrial turbines and reactors.
Nanofluids=Nanoparticles in the coolant carry heat faster. Neutronium kinetic heaters, boilers, steam engines and turbines.
CentrifugalPump=An impeller throws fluid outward and drives it along the pipe. Aluminium pumps, condensers and electrolyzers.
Passivation=An oxide film protects steel from acids. Stainless steel chemical machines.
CatalyticCracking=A catalyst splits heavy oil into light fractions. Titanium reactors, baths, fermenters, electrolyzers and pyrolysis units.
VacuumDistillation=Low pressure lets heavy fractions boil before they break down. Titanium pumps, condensers and fractionating columns.
FilamentWinding=Fiber wound under tension forms vessels that hold pressure. Composite reactors, baths, fermenters and electrolyzers.
MembraneSeparation=A membrane passes some molecules and holds back others. Composite pumps, condensers and fractionating columns.
NeutroniumLining=A lining that no reagent dissolves. Neutronium reactors, baths, fermenters and electrolyzers.
Superfluidity=A fluid with zero viscosity flows without loss. Neutronium pumps, condensers and fractionating columns.
Dynamo=A coil rotating in a magnetic field gives current. Steel generators, Stirling engines and computers.
ThreePhaseCurrent=Three currents shifted in phase drive motors evenly and travel far. Aluminium generators, engines and wind turbines.
ElectricalSteel=Silicon steel cores lose less energy in generators and motors. Stainless steel generators and engines.
Turbocharging=Exhaust drives a turbine that forces more air into the engine. Titanium generators and engines.
PowerElectronics=Semiconductors switch large currents without moving parts. Composite generators.
NeodymiumMagnets=Rare-earth magnets give a strong field in a small motor. Composite engines, alternators and wind turbines.
Superconductivity=Cooled windings carry current with no resistance. Neutronium generators.
MagneticBearings=Shafts held by a magnetic field turn without contact. Neutronium engines, alternators and wind turbines.
SeleniumPhotocell=Selenium gives current in light. Stainless steel solar panels, diodes, computers and battery boxes.
SiliconSolarCell=Crystalline silicon turns more light into current. Titanium solar panels, diodes, computers and battery boxes.
ThinFilmCells=Thin semiconductor layers on a light base. Composite solar panels and battery boxes.
GalliumNitride=A semiconductor that runs hotter and faster than silicon. Composite diodes and computers.
QuantumDots=Nanocrystals tuned to absorb the whole spectrum. Neutronium solar panels, diodes and battery boxes.
BeltDrive=A belt passes rotation from one shaft to another. Steel robot arms, conveyors, loaders and drilling rigs.
AssemblyLine=Each station does one operation, and the line carries the work on. Aluminium robot arms, conveyors, loaders and sorters.
RotaryDrilling=A rotating bit grinds the rock at the bottom of the hole. Aluminium drilling rigs and automatic farms.
Hydraulics=Fluid under pressure moves heavy parts. Stainless steel robot arms, conveyors, loaders and sorters.
Turbodrilling=Drilling mud pumped down the pipe spins a turbine right at the bit. Stainless steel drilling rigs and automatic farms.
IndustrialRobots=Programmable arms repeat work without pause. Titanium robot arms, conveyors, loaders and sorters.
DiamondDrilling=Diamond-set bits cut the hardest rock. Titanium drilling rigs, pumpjacks and automatic farms.
MachineVision=Cameras let a machine find and sort parts. Composite robot arms, conveyors, loaders and sorters.
DirectionalDrilling=A borehole steered sideways reaches more of the deposit. Composite drilling rigs, pumpjacks and automatic farms.
MagneticLevitation=Loads float in a magnetic field without friction. Neutronium robot arms, conveyors and sorters.
PlasmaDrilling=Plasma melts rock instead of cutting it. Neutronium drilling rigs, pumpjacks and automatic farms.
SheetRolling=Steel rolled into thin sheet. Steel chests, item racks, containers, lamps and signs.
DieCasting=Molten metal pressed into a mold. Aluminium chests, item racks, containers and metal blocks.
SpotWelding=Sheets joined by current at single points. Stainless steel chests, item racks and containers.
Anodizing=Electrolysis grows a hard oxide layer on the metal surface. Titanium chests, item racks, deep storage and blocks.
AutoclaveMolding=Composite cured under heat and pressure. Composite chests, item racks, deep storage and blocks.
DegenerateMatter=Matter packed past atomic density. Neutronium chests, item racks, deep storage and blocks.

