[description]
Booster=Speeds up the machine its far end faces. Draws its own electricity plus a share of what the boosted machine consumes.
Spawner=A block for setting the player's respawn point.
FissionReactor=Uses controlled nuclear reactions to generate heat.
SolarPanel=Converts solar energy into electricity with high efficiency.
Sifter=Sifts ore gravel to extract rare resources.
Constructor=Basic automatic assembler for blocks and items.
Destroyer=Permanently destroys raw resources and disassembles machines and blocks into some of their components.
ChemicalBath=Washes ore gravel with strong acids to extract rare resources.
Fermenter=Processes organic matter into fluids and gases.
ItemRack=Stores a large quantity of a single item type.
Electrolyzer=Breaks down resources into components using electricity.
IndustrialGenerator=High-power electricity generator.
SmallSolarPanel=Converts solar energy into electricity.
Macerator=Zerkleinert verschiedene Arten von Schotter. Zerschreddert Platten und andere Metallteile zu Staub.
Separator=Zerlegt Staub in weitere Bestandteile.
AutomaticHammer=Erzeugt Platten aus Metallbarren. Zerkleinert Erze.
Boiler="Wärmeenergie und Wasser => Dampf."
Pipe=Verteilt eine Flüssigkeit
HeatPipe=Verteilt Wärme
Flywheel=Verteilt Bewegungsenergie
Connector=Leitet Strom
OreWasher=Extrahiert weitere Materialien aus Erzen.
Container=Speichert Flüssigkeiten oder Gase
SteamEngine=Converts steam into kinetic energy.
StirlingEngine=Erzeugt Bewegungsenergie aus Wärmeenergie
CombustionEngine=Erzeugt Bewegungsenergie durch Verbrennung von Flüssigtreibstoff.
PyrolysisUnit=Zersetzt Brennstoff in kleinere Komponenten.
Generator=Erzeugt Strom aus Bewegungsenergie.
CompactGenerator=Erzeugt Strom aus Bewegungsenergie.
ElectricEngine=Erzeugt aus Strom Bewegungsenergie.
RobotArm=Bewegt Gegenstände zwischen verschiedenen Vorrichtungen und Fließbändern.
Pump=Bewegt Füssigkeiten zwischen verschiedenen Vorrichtungen und Rohren.
FilteringPump=Bewegt Füssigkeiten zwischen verschiedenen Vorrichtungen und Rohren.
Smelter=Primitiver Schmelzofen. Wird zum Herstellen von Kupfer, Glas und Gold verwendet.
SteamTurbine=Erzeugt Bewegungsenergie aus Dampf.
ArcSmelter=Hochentwickelter Schmelzofen. Geeignet für das Herstellen von Edelstahl.
Furnace=Erzeugt Wärmeenergie aus Festbrennstoff.
Oven=Vorrichtung zur Herstellung von Holzkohle, Koks und gebranntem Ton.
BlastFurnace=Schmelzofen für Stahl.
FluidFurnace=Erzeugt Wärmeenergie aus Flüssigtreibstoff.
ElectricFurnace=Erzeugt Wärmeenergie aus Strom.
BatteryBox=Speichert Strom
DrillingRig=Automatisiertes Gerät zum Abbau von Erzen und Gestein. Die Lagerstätten sind auf der Weltkarte markiert. Mit dem Scanner kann nach neuen Lagerstätten gesucht werden.
Assembler=Vorrichtung zur Herstellung von kleineren Gegenständen und Microchips.
Lamp=Leuchtet in der Nacht.
Mixer=Anlage zum Herstellen von Gemischen und Betonblöcken.
AutomaticFarm=Automatisierte Anlage zum Anbauen von Pflanzen.
AtmosphericCondenser=Sammelt durch Kondensation verschiedene Flüssigkeiten oder Gase aus der Atmosphäre.
Monitor=Displays the graphical interface of the device in front of it.
Computer=Generiert Wissen für Forschung.
QuantumComputer=Creates quantum research points.
IndustrialSeparator=Spaltet Mineralstaub in weitere Bestandteile.
Radiator=Entsorgt Wärmeenergie.
Diode=Läßt Strom in nur eine Richtung durch.
Pumpjack=Automatisiertes Gerät für die Förderung von Flüssigkeiten. Die Lagerstätten sind auf der Weltkarte markiert. Mit dem Scanner kann nach neuen Lagerstätten gesucht werden.
IndustrialSmelter=Hochentwickelte Schmelzhütte. Wird zum Herstellen von Titan und Graphit verwendet.
IndustrialElectricEngine=Very powerfull electric engine.
IndustrialSteamTurbine=Very powerful hybrid of steam turbine and generator.
Riteg=Infinite radioisotope heat source.
FusionReactor=Neutronium source.
IndustrialBoiler=Very powerful boiler with big internal buffer.
KineticHeater=Converts kinetic energy into heat.
SteelRail=A track segment trains run on. Links to the rails beside it to make a route.
AdminElectricGenerator=Creative source of electricity. Produces it out of nothing, without limit.
AdminKineticGenerator=Creative source of kinetic energy. Produces it out of nothing, without limit.
AdminHeatGenerator=Creative source of heat. Produces it out of nothing, without limit.
AdminFluidGenerator=Creative source of fluids. Produces any of them out of nothing, without limit.
AdminItemGenerator=Creative source of items. Produces any of them out of nothing, without limit.
AdminExterminator=Creative sink. Accepts items, fluids, heat and kinetic energy and destroys everything it is given.
CreativeController=Creative control over the world. Changes the rules of the session it stands in.
Chest=Stores items of any kind. Machines and robot arms can take from it and put into it.
DeepStorage=Stores an enormous quantity of a single item type.
Conveyor=Moves items along itself. Chains into lines and feeds whatever it runs into.
Loader=Moves items between a conveyor line and the device beside it.
Splitter=Divides an item flow between its outputs.
Sorter=Sends items to the output its filter names, and the rest onward.
Sign=Displays a short text a player writes on it.
AdvancedSign=Displays a longer text a player writes on it.
BigMonitor=Displays the graphical interface of the device in front of it, on a larger screen.
HugeMonitor=Displays the graphical interface of the device in front of it, on the largest screen.
CopperConnector=Electricity conductor.
ElectricalSwitch=Breaks and restores the electric network it stands in.
Vent=Opens and closes the fluid line it stands in.
PlasmaPipe=Heat conductor for the hottest lines. Stores some of the heat it carries.
TeslaTower=A high-voltage tower. Draws a large amount of electricity while it works.
WindTurbine=Converts wind into electricity.
FractionatingColumn=Separates a fluid mix into its fractions.
IndustrialChemReactor=Runs chemical reactions between fluids, gases and solids.
Pumpjack_leg=Extracts liquid from the deposit under it, driven by kinetic energy.
RailStation=Loads and unloads trains. Carries a name and a schedule other stations route by.
DroneStation=A powered base station for drones.
Portal=The way off this world. The last thing a factory is built for.
LogicInterface=Reads and writes the signals of a logic network. Rows of conditions decide what it sends.
LogicSensor=Reads the state of the device beside it into a logic signal.
LogicWire=Data conductor. Carries logic signals between the devices it links.

