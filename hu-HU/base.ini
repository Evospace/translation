ResearchAutomaticMining=Research Automatic Mining
ResearchAutomaticMiningDesc1=<blue>{research:Automatization}</> unlocks the parts that move items between machines. <blue>{research:AutomaticMining}</> behind it unlocks the <blue>{item:CopperDrillingRig}</>, which mines ore on its own.
ResearchAutomaticMiningDesc2=Keep fuel in the furnace while both run: the computer produces points only while it has power.
