[description]
Spawner=Un bloque para establecer el punto de reaparición del jugador.
FissionReactor=Utiliza reacciones nucleares controladas para generar calor.
SolarPanel=Convierte la energía solar en electricidad con alta eficiencia.
Sifter=Tamiza grava de mineral para extraer recursos raros.
Constructor=Ensamblador automático básico para bloques y objetos.
Destroyer=Destruye permanentemente recursos en bruto y desmantela máquinas y bloques en algunos de sus componentes.
ChemicalBath=Lava grava de mineral con disolventes para extraer recursos raros.
Fermenter=Procesa materia orgánica en fluidos y gases.
ItemRack=Almacena una gran cantidad de un solo tipo de objeto.
Electrolyzer=Descompone recursos en componentes usando electricidad.
IndustrialGenerator=Generador eléctrico de alta potencia.
SmallSolarPanel=Convierte la energía solar en electricidad.
Macerator=Muele la grava para su posterior procesamiento. Convierte las placas y las piezas en polvo.
Separator=Separa el polvo en componentes.
AutomaticHammer=Produce placas a partir de lingotes. Muele el mineral y transforma en grava.
Boiler=Convierte el calor y el agua en vapor.
Pipe=Una tubería, es un conducto que cumple la función de transportar agua u otros fluidos.
HeatPipe=Conduce y almacena la energía térmica.
Flywheel=Un volante de inercia o volante motor es un elemento totalmente pasivo que únicamente aporta al sistema una inercia adicional de modo que le permite almacenar energía cinética.
Connector=Conector
OreWasher=Extrae recursos adicionales del mineral.
Container=Depósito para almacenar líquidos o gases. Dependiendo del material tienen mas o menos capacidad.
SteamEngine=Convierte el vapor en energía cinética.
StirlingEngine=Convierte la energía térmica en energía cinética.
CombustionEngine=Quema combustible líquido para generar energía cinética.
PyrolysisUnit=Descompone el combustible en componentes más pequeños.
Generator=Convierte la energía cinética en electricidad.
CompactGenerator=Convierte la energía cinética en electricidad.
ElectricEngine=Convierte la electricidad en energía cinética.
RobotArm=Mueve los artículos entre los dispositivos y los transportadores.
Pump=Transporta el líquido o gases entre la maquinaria por las tuberías. También extrae líquidos o gases de las maquinas o los introduce.
FilteringPump=Bomba con filtro para los liquidos o gases. Transporta el líquido entre la maquinaria por las tuberías. También extrae líquidos o gases de las maquinas o los introduce.
Smelter=Una primitiva fundición de piedra. Se utiliza para la fundición de cobre, vidrio y oro.
SteamTurbine=Convierte la energía del vapor en energía cinética.
ArcSmelter=Fundición avanzada. Adecuada para la fundición de acero inoxidable.
Furnace=Quema combustible sólido para generar calor.
Oven=Dispositivo para la producción de carbón, coque y arcilla.
BlastFurnace=Horno de fundición de acero.
FluidFurnace=Quema combustible líquido para generar calor.
ElectricFurnace=Utiliza la electricidad para generar calor.
BatteryBox=Batería almacena energía.
DrillingRig=Dispositivo automático para la extracción de mineral y piedra. Los depósitos están marcados en el mapa global. Utilice el escáner para buscar nuevos depósitos, si lo colocas en cualquier sitio solo extraera piedras.
Assembler=Una máquina para ensamblar pequeños objetos y microchips.
Lamp=Lámpara para iluminar una zona.
Mixer=Dispositivo para producir mezclas y bloques de hormigón.
AutomaticFarm=Dispositivo automatizado para el cultivo de plantas, arboles, calabazas. Consume agua.
AtmosphericCondenser=Recolecta líquidos y gases de la atmósfera.
Monitor=Displays the graphical interface of the device in front of it.
Computer=Desarrolla puntos de investigación.
IndustrialSeparator=Separa el polvo en componentes.
Radiator=Elimina la energía térmica/calor.
Diode=Conduce la electricidad en sólo una dirección.
Pumpjack=Dispositivo automático para la extracción de líquidos. Los depósitos están marcados en el mapa global. Utilice el escáner para buscar nuevos depósitos.
IndustrialSmelter=Fundición avanzada. Se utiliza para la fundición de minerales avanzados.
IndustrialElectricEngine=Very powerfull electric engine.
IndustrialSteamTurbine=Very powerful hybrid of steam turbine and generator.
Riteg=Un generador termoeléctrico de radioisótopos o RTG (siglas de su denominación en inglés Radioisotope Thermoelectric Generator RTG or Riteg) es un generador eléctrico simple que obtiene su energía de la liberada por la desintegración de determinados elementos radiactivos.
FusionReactor=Reactor de fusión
IndustrialBoiler=Very powerful boiler with big internal buffer.
KineticHeater=Convierte la energía cinética en calor.
SteelRail=A track segment trains run on. Links to the rails beside it to make a route.
AdminElectricGenerator=Creative source of electricity.
AdminKineticGenerator=Creative source of kinetic energy.
AdminHeatGenerator=Creative source of heat.
AdminFluidGenerator=Creative source of fluids.
AdminItemGenerator=Creative source of items.
AdminExterminator=Creative sink. Accepts items, fluids, heat and kinetic energy and destroys everything it is given.
CreativeController=Creative control over the world. Changes the rules of the session it stands in.
Chest=Stores items of any kind.
DeepStorage=Stores an enormous quantity of a single item type.
Conveyor=Moves items along itself. Chains into lines and feeds whatever it runs into.
Splitter=Divides an item flow between its outputs.
Sign=Displays a short text a player writes on it.
BigMonitor=Displays the graphical interface of the device in front of it, on a larger screen.
HugeMonitor=Displays the graphical interface of the device in front of it, on the largest screen.
CopperConnector=Electricity conductor.
ElectricalSwitch=Breaks and restores the electric network it stands in.
Vent=Opens and closes the fluid line it stands in.
PlasmaPipe=Heat conductor.
TeslaTower=A high-voltage tower. Draws a large amount of electricity while it works.
WindTurbine=Converts wind into electricity.
FractionatingColumn=Separates a fluid mix into its fractions.
IndustrialChemReactor=Runs chemical reactions between fluids, gases and solids.
RailStation=Loads and unloads trains. Carries a name and a schedule other stations route by.
DroneStation=A powered base station for drones.
