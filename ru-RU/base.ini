BuildAutomaticMineDesc1=Месторождение руды находится по карте
BuildAutomaticMineDesc2=Рядом с установкой ставится {item:StoneFurnace}, на неё — {item:CopperStirlingEngine}. Кинетический выход двигателя соединяется с кинетическим входом установки, в печь загружается топливо.
