Assembler=Устройство для сборки небольших предметов и микросхем.
Lamp=Настраиваемый источник света.
Mixer=Устройство для производства смесей и блоков бетона
AutomaticFarm=Автоматизированное устройство для выращивания растений. Потребляет воду.
AtmosphericCondenser=Собирает жидкости и газы из атмосферы
Monitor=Displays the graphical interface of the device in front of it.
Computer=Вырабатывает очки исследований.
QuantumComputer=Creates quantum research points.
IndustrialSeparator=Разделяет пыли на компоненты.
Radiator=Уничтожает тепловую энергию.
Diode=Проводит электричество только в одном направлении
