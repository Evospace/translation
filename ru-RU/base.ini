[quests]
SelectQuestHint=Select a quest to view details
OreToPowerChapter=From Ore to Power
Welcome=Welcome to Evospace
WelcomeDesc1=Aim at ore, rock or a tree and mine it with <blue>{key:ActionPrimary}</>.
WelcomeDesc2=This log lists what to do next and opens with <blue>{key:QuestBook}</>. The map is <blue>{key:ToggleMap}</>.
ObjOpenQuestBook=Open the quest log with {key:QuestBook}
ObjReturnToWorld=Return to the world
GatherCopperOre=Gather Copper Ore
GatherCopperOreDesc=Copper ore shows on the surface. Mine it with your multitool.
GatherCopperOreDesc2=A deposit close by shows on the compass at the top of the screen, and the map (<blue>{key:ToggleMap}</>) marks the deposits around you.
ObjGatherCopperOre=Mine {count} × {item:ChalcopyriteOre} or {item:MalachiteOre}
GatherFuel=Gather Fuel
GatherFuelDesc=Coal is mined like ore, logs come from trees. A furnace burns both.
ObjGatherCoal=Gather {count} × {item:CoalOre}
ObjGatherLogs=Gather {count} × {item:Log}
OpenInventory=Open Your Inventory
OpenInventoryDesc1=Open your inventory with <blue>{key:ToggleInventory}</>. What you carry is on the left, the item database is on the right.
OpenInventoryDesc2=Find an item in the database and order it. The same key closes the window.
ObjOpenInventory=Open the inventory with {key:ToggleInventory}
MineStone=Gather Stone
MineStoneDesc=Mine {item:StoneSurface} from rocks, boulders and cliff faces with your multitool.
ObjMineStone=Gather {count} × {item:StoneSurface}
ReturnHome=Back to the Base
ReturnHomeDesc1=Carry the ore back to the platform you started on: it holds the {item:LandingPad}, which you will need later.
ReturnHomeDesc2=The compass at the top of the screen points to the spawn, and <blue>{key:Escape}</> opens the menu with Teleport to Home.
ObjReturnHome=Walk back to the base
CraftFirstBlocks=Craft the Furnaces and the Smelter
CraftFirstBlocksDesc=Craft the {item:StoneFurnace} and the {item:StoneSmelter}. One furnace heats the smelter, another goes to the power plant.
ObjCraftStoneFurnace=Craft {count} × {item:StoneFurnace}
ObjCraftStoneSmelter=Craft {count} × {item:StoneSmelter}
BuildFirstSmelter=Build Your First Smelter
BuildFirstSmelterDesc1=Choose a place with free space around it.
BuildFirstSmelterDesc2=Place a {item:StoneFurnace}. With the {item:StoneSmelter} in hand, aim at the furnace: the smelter docks onto its heat side.
ObjBuildStoneFurnace=Build a {item:StoneFurnace}
ObjStackStoneSmelter=Stand a {item:StoneSmelter} directly on the {item:StoneFurnace}
SmeltCopperPlates=Smelt Copper
SmeltCopperPlatesDesc1=Load fuel into the {item:StoneFurnace} and copper ore into the {item:StoneSmelter}.
SmeltCopperPlatesDesc2=Take the plates out of the smelter's output when it fills up.
ObjSmeltCopperPlates=Smelt {count} × {item:CopperPlate}
CraftMachines=From Heat to Research
CraftMachinesDesc=Craft a {item:CopperStirlingEngine}, a {item:CopperCompactGenerator} and a {item:CopperComputer}.
ObjCraftStirlingEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Craft {count} × {item:CopperCompactGenerator}
ObjCraftComputer=Craft {count} × {item:CopperComputer}
BuildFirstPowerPlant=Build the Power Plant
BuildFirstPowerPlantDesc1=Place the second {item:StoneFurnace}. Aim at it with the {item:CopperStirlingEngine} in hand, then dock the {item:CopperCompactGenerator} onto the engine and the {item:CopperComputer} onto the generator.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> switches between the docking positions. Load fuel into the furnace to start the plant.
ObjBuildPowerPlant=Join furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer} into one working line
AutomationChapter=Automation
ResearchBasicMachines=Open the Research Tree
ResearchBasicMachinesDesc1=Open the research tree with <blue>{key:Journal}</> or the research button on the left bar. The button also shows the time left on the running research.
ResearchBasicMachinesDesc2=Start {research:BasicMachines}. The computer completes it while you play, and its recipes appear in your crafting list.
ObjResearchBasicMachines=Research {research:BasicMachines} ({key:Journal})
ResearchAutomaticMining=Research Automatic Mining
ResearchAutomaticMiningDesc1={research:Automatization} unlocks the parts that move items between machines. {research:AutomaticMining} behind it unlocks the {item:CopperDrillingRig}, which mines ore on its own.
ResearchAutomaticMiningDesc2=Keep fuel in the furnace while both run: the computer produces points only while it has power.
ObjResearchAutomatization=Research {research:Automatization}
ObjResearchAutomaticMining=Research {research:AutomaticMining}
BuildAutomaticMine=Set Up the Automatic Mine
BuildAutomaticMineDesc1=Find an ore deposit on the map, walk to it and stand a {item:CopperDrillingRig} on it.
BuildAutomaticMineDesc2=Place a {item:StoneFurnace} next to the rig and a {item:CopperStirlingEngine} on it. Connect the engine kinetic output to the rig kinetic input and load fuel into the furnace.
BuildAutomaticMineDesc3=Research {research:Chest} and place a {item:StoneChest} at the rig output side. Mined ore goes into the chest.
ObjPowerDrillingRig=Power the {item:CopperDrillingRig} from a {item:CopperStirlingEngine} and a {item:StoneFurnace}
ObjDockMineChest=Place a chest at the rig output side
