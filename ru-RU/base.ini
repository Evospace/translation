[description]
Spawner=Блок для установки точки возрождения игрока.
FissionReactor=Использует контролируемые ядерные реакции для производства тепла.
SolarPanel=Преобразует солнечную энергию в электрическую с высокой эффективностью.
Sifter=Просеивает гравий для извлечения редких ресурсов.
Constructor=Базовый автоматический сборщик блоков и предметов.
Destroyer=Уничтожает ресурсы, машины и блоки на изначальные компоненты.
ChemicalBath=Промывает рудный гравий растворителями для извлечения редких ресурсов.
Fermenter=Перерабатывает органику в жидкости и газы.
ItemRack=Хранит большое количество предметов одного типа.
Electrolyzer=Разлагает ресурсы на составляющие с помощью электричества.
IndustrialGenerator=Мощный генератор электричества.
SmallSolarPanel=Преобразует солнечную энергию в электричество.
Macerator=Измельчает гравий для дальнейшей переработки. Превращает пластины и детали в пыль.
Separator=Разделяет пыли на компоненты.
AutomaticHammer=Производит пластины из слитков. Измельчает руду до гравия.
Boiler=Превращает тепловую энергию и воду в пар.
Pipe=Проводник жидкостей.
HeatPipe=Проводник тепла.
Flywheel=Проводник кинетической энергии.
Connector=Проводник кинетической энергии.
OreWasher=Добывает дополнительные ресурсы из руды.
Container=Хранилище жидкостей.
SteamEngine=Преобразует пар в кинетическую энергию.
StirlingEngine=Преобразует тепловую энергию в кинетическую.
CombustionEngine=Сжигает жидкое топливо для получения кинетической энергии.
PyrolysisUnit=Расщепляет топливо на более простые компоненты.
Generator=Преобразует кинетическую энергию в электричество.
CompactGenerator=Преобразует кинетическую энергию в электричество.
ElectricEngine=Преобразует электричество в кинетическую энергию.
RobotArm=Перемещает предметы между устройствами и конвейерами.
Pump=Перемещает жидкости между устройствами и трубами.
WaterWell=Качает воду в любой точке планеты, на которой есть вода.
FilteringPump=Перемещает жидкости между устройствами и трубами.
Smelter=Примитивная каменная плавильня. Используется для выплавки меди, стекла и золота.
SteamTurbine=Превращает энергию пара в кинетическую энергию.
ArcSmelter=Продвинутая плавильня. Подходит для выплавки нержавеющей стали.
Furnace=Сжигает твердое топливо для получения тепловой энергии.
Oven=Устройство для производства древесного угля, кокса и обжига глины.
BlastFurnace=Печь для выплавки стали.
FluidFurnace=Сжигает жидкое топливо для получения тепловой энергии.
ElectricFurnace=Использует электричество для получения тепловой энергии.
BatteryBox=Большое и эффективное хранилище энергии.
DrillingRig=Автоматизированное устройство добычи руды и камня. Месторождения отмечены на глобальной карте.
Assembler=Устройство для сборки небольших предметов и микросхем.
Lamp=Настраиваемый источник света.
Mixer=Устройство для производства смесей и блоков бетона
AutomaticFarm=Автоматизированное устройство для выращивания растений. Потребляет воду.
AtmosphericCondenser=Собирает жидкости и газы из атмосферы
Monitor=Показывает интерфейс устройства, стоящего перед ним.
Computer=Вырабатывает очки исследований.
IndustrialSeparator=Разделяет пыли на компоненты.
Radiator=Уничтожает тепловую энергию.
Diode=Проводит электричество только в одном направлении
Pumpjack=Автоматизированное устройство для добычи жидкостей. Месторождения показывает фильтр нефтяных источников на карте. Качалка ставится в регионе с нефтью.
IndustrialSmelter=Продвинутая плавильня. Используется для выплавки титана и победита
IndustrialElectricEngine=Мощный электрический двигатель.
IndustrialSteamTurbine=Мощная паровая турбина.
Riteg=Бесконечный радиоизотопный источник тепла.
FusionReactor=Источник нейтрония.
IndustrialBoiler=Мощный котёл.
KineticHeater=Преобразует кинетическую энергию в тепло.
SteelRail=Отрезок пути для поездов. Соединяется с соседними рельсами в маршрут.
AdminElectricGenerator=Креативный источник электричества.
AdminKineticGenerator=Креативный источник кинетической энергии.
AdminHeatGenerator=Креативный источник тепла.
AdminFluidGenerator=Креативный источник жидкостей.
AdminItemGenerator=Креативный источник предметов.
AdminExterminator=Креативный сток. Принимает предметы, жидкости, тепло и кинетическую энергию и уничтожает всё, что получает.
CreativeController=Креативное управление миром. Меняет правила сессии, в которой стоит.
Chest=Хранит предметы любого типа.
DeepStorage=Хранит огромное количество предметов одного типа.
Conveyor=Перемещает предметы по себе. Собирается в линии и подаёт в то, во что упирается.
Loader=Перемещает предметы между конвейерной линией и соседним устройством.
Splitter=Делит поток предметов между своими выходами.
Sorter=Направляет предметы на выходы согласно фильтрам. Предметы, не подходящие ни под один фильтр, идут на выход по умолчанию. Если он не задан, они застревают.
Sign=Показывает короткий текст, который написал игрок.
AdvancedSign=Показывает более длинный текст, который написал игрок.
BigMonitor=Показывает интерфейс устройства, стоящего перед ним, на большом экране.
HugeMonitor=Показывает интерфейс устройства, стоящего перед ним, на самом большом экране.
CopperConnector=Проводник электричества.
ElectricalSwitch=Разрывает и восстанавливает электрическую сеть, в которой стоит.
Vent=Открывает и закрывает линию жидкости, в которой стоит.
Button=При нажатии отправляет импульс длительностью один тик в логический провод позади себя.
ToggleButton=Поддерживает сигнал в логическом проводе позади себя до повторного нажатия.
PressurePlate=Передаёт сигнал в логический провод под плитой, пока на ней кто-то стоит.
LogicTransceiver=Передаёт логические сигналы без проводов. Отправляет сигналы своего провода в канал и передаёт в свой провод сигналы, полученные по каналу от других приёмопередатчиков. Канал задаётся сигналом ; range is unlimited within one world.
TeslaTower=Высоковольтная башня. Во время работы потребляет много электричества.
WindTurbine=Преобразует ветер в электричество.
FractionatingColumn=Разделяет смесь жидкостей на фракции.
IndustrialChemReactor=Проводит химические реакции между жидкостями, газами и твёрдыми веществами.
RailStation=Загружает и разгружает поезда. Имеет имя и расписание, по которым строят маршрут другие станции.
RailSignal=Пропускает поезд в блок-участок впереди, если тот свободен.
RailChainSignal=Пропускает поезд, если путь до следующего светофора свободен.
DroneStation=Базовая станция для дронов. Требует электричество.
Portal=Посылает межгалактический пинг. Открывает доступ к портальным технологиям.
LogicInterface=Читает и пишет сигналы логической сети. Что отправить, решают строки условий.
LogicSensor=Читает состояние соседнего устройства в логический сигнал.
LogicWire=Проводник данных. Переносит логические сигналы между связанными устройствами.
Technology=Открывает улучшенные версии машин.

