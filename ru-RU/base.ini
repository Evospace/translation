ObjCraftLineSmelter=Craft {count} × {item:StoneSmelter}
ObjCraftLineEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Craft {count} × {item:StoneFurnace}
CraftOreMultiplication=Multiply the Ore
CraftOreMultiplicationDesc1=A {item:StoneSmelter} gives 1 plate from 1 ore. The {item:CopperAutomaticHammer} crushes ore into impure gravel with a 50% {tips:Productivity} bonus, the {item:CopperMacerator} grinds the gravel into ore dust with another 50%. Smelting the dust gives about 2.25 plates from the same ore.
CraftOreMultiplicationDesc2=One hammer produces enough gravel for two macerators.
ObjCraftMultiplierMacerators=Craft {count} × {item:CopperMacerator}
ObjCraftMultiplierArms=Craft {count} × {item:CopperRobotArm}
ResearchCircuits=Research the Circuit
ResearchCircuitsDesc1=The next big step is your own circuit production: {research:CircuitBoard}, {research:Triod}, {research:Circuit}. {research:Constructor} unlocks a machine that crafts hand recipes automatically.
