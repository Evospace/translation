[description]
Spawner=Blok umożliwiający postawianie punktu odrodzenia gracza.
FissionReactor=Wykorzystuje kontrolowane reakcje jądrowe w celu generowania ciepła.
SolarPanel=Zmienia światło w elektryczność z wysoką wydajnością.
Sifter=Przesiewa rozdrobniony urobek w celu wydobycia rzadkich surowców.
Constructor=Podstawowy oraz automatyczny montaż bloków i elementów.
Destroyer=Trwale niszczy surowce i rozbiera maszyny oraz bloki na niektóre komponenty.
ChemicalBath=Płucze rozdrobniony urobek silnymi kwasami w celu wydobycia rzadkich surowców.
Fermenter=Przetwarza materię organiczną w ciecze i gazy.
ItemRack=Przechowuje dużą ilość towarów jednego typu.
Electrolyzer=Rozkłada zasoby na komponenty przy użyciu energii elektrycznej.
IndustrialGenerator=Generator prądu o dużej mocy.
SmallSolarPanel=Zmienia światło w elektryczność.
Macerator=Rozdrabnia w celu dalszej obróbki. Zamienia płyty w wióry.
Separator=Segreguje pył na składniki.
AutomaticHammer=Produkuje płyty ze sztab. Rozdrabnia urobek.
Boiler=Zamienia ciepło i wodę w parę.
Pipe=Przesyła ciecze.
HeatPipe=Przesyła ciepło.
Flywheel=Przesyła energię kinetyczną.
Connector=Przesyła elektryczność.
OreWasher=Wydobywa dodatkowe zasoby z urobku.
Container=Przechowywanie cieczy.
SteamEngine=Zamienia parę wodną w energię kinetyczną.
StirlingEngine=Zamienia ciepło w energię kinetyczną.
CombustionEngine=Spala paliwa płynne w celu wytworzenia energii kinetycznej.
PyrolysisUnit=Dokonuje ekstrakcji paliwa na pożądane surowce.
Generator=Zamienia energię kinetyczną na energię elektryczną.
CompactGenerator=Zamienia energię kinetyczną na energię elektryczną.
ElectricEngine=Zamienia energię elektryczną w energię kinetyczną.
RobotArm=Przenosi przedmioty pomiędzy urządzeniami i przenośnikami.
Pump=Transportuje płyny między urządzeniami i rurami. Może być umieszczony pod wodą w celu zbierania wody.
FilteringPump=Transportuje płyny między urządzeniami i rurami.
Smelter=Prymitywna odlewnia kamienia. Służy do wytopu miedzi, szkła i złota.
SteamTurbine=Zamienia energię pary wodnej w energię kinetyczną.
ArcSmelter=Zaawansowana huta. Nadaje się do wytopu stali nierdzewnej.
Furnace=Spala paliwa stałe w celu wytworzenia ciepła.
Oven=Urządzenie do wypalania węgla drzewnego, koksu i gliny.
BlastFurnace=Piec do wytopu stali.
FluidFurnace=Spala paliwa płynne w celu wytworzenia ciepła.
ElectricFurnace=Wykorzystuje energię elektryczną do wytwarzania ciepła.
BatteryBox=Duże i wydajne magazynowanie energii.
DrillingRig=Zautomatyzowane urządzenie do wydobywania urobku i kamienia. Złoża są oznaczone na mapie globalnej.
Assembler=Urządzenie służące do efektywnego montażu małych elementów i obwodów.
Lamp=Konfigurowalne źródło światła.
Mixer=Urządzenie do produkcji mieszanek.
AutomaticFarm=Zautomatyzowane urządzenie do uprawy roślin. Zużywa wodę. Żyzność gleby zmniejsza się z każdą operacją.
AtmosphericCondenser=Gromadzi ciecze i gazy z atmosfery.
Monitor=Wyświetla Interfejs graficzny urządzenia znajdującego się przed nim.
Computer=Tworzy punkty badawcze.
QuantumComputer=Tworzy punkty badań kwantowych.
IndustrialSeparator=Rozdziela pył na składniki.
Radiator=Wypromieniuje ciepło do otoczenia.
Diode=Przewodzi prąd tylko w jednym kierunku.
Pumpjack=Zautomatyzowane urządzenie do ekstrakcji cieczy. Złoża są zaznaczone na mapie globalnej. Użyj skanera, aby wyszukać nowe złoża.
IndustrialSmelter=Zaawansowana huta. Służy do wytopu tytanu i grafitu.
IndustrialElectricEngine=Mocny silnik elektryczny.
IndustrialSteamTurbine=Potężna turbina parowa.
Riteg=Nieskończone źródło ciepła radioizotopowego.
FusionReactor=Źródło Neutronium.
IndustrialBoiler=Potężny kocioł.
KineticHeater=Zamienia energię kinetyczną w ciep
SteelRail=Po danym odcinku toru jeżdżą pociągi. Połączenia z przyległymi szynami utworzą trasę.
AdminElectricGenerator=Kreatywne źródło energii elektrycznej. Produkuje ją z niczego, bez żadnych ograniczeń.
AdminKineticGenerator=Kreatywne źródło energii kinetycznej. Wytwarza ją z niczego, bez żadnych ograniczeń.
AdminHeatGenerator=Kreatywne źródło ciepła. Wytwarza się je z niczego, bez żadnych ograniczeń.
AdminFluidGenerator=Kreatywne źródło cieczy. Produkuje się je z niczego, bez żadnych ograniczeń.
AdminItemGenerator=Kreatywne źródło przedmiotów. Tworzy dowolne przedmioty z niczego, bez żadnych ograniczeń.
AdminExterminator=Kreatywny odpływ. Przyjmuje przedmioty, płyny, ciepło i energię kinetyczną i niszczy wszystko, co mu zostanie dostarczone.
CreativeController=Kreatywna kontrola nad światem. Zmienia zasady sesji, w której uczestniczymy.
Chest=Przechowuje przedmioty wszelkiego rodzaju. Maszyny i ramiona robotów mogą je z niego wyjmować i do niego wkładać.
DeepStorage=Przechowuje ogromną ilość przedmiotów jednego typu.
Conveyor=Przesuwa przedmioty wzdłuż siebie. Łączy w łańcuchy i zasila wszystko, na co natrafi.
Loader=Przemieszcza przedmioty pomiędzy linią taśmociągu a urządzeniem znajdującym się obok niej
Splitter=Dzieli przepływ elementów pomiędzy jego wyjścia.
Sorter=Wysyła na wyjście elementy, nazwy swoich filtrów i resztę.
Sign=Wyświetla krótki tekst napisany przez gracza
AdvancedSign=Wyświetla dłuższy tekst napisany przez gracza.
BigMonitor=Wyświetla interfejs graficzny urządzenia znajdującego się przed nim na większym ekranie.
HugeMonitor=Wyświetla interfejs graficzny urządzenia znajdującego się przed nim, na największym ekranie.
CopperConnector=Przewodnik prądu.
ElectricalSwitch=Rozłącza i przywraca sieć elektryczną, w której się znajduje.
Vent=Otwiera i zamyka przepływ cieczy, w którym się znajduje.
PlasmaPipe=Przewodnik ciepła dla najgorętszych linii. Przechowuje część ciepła, które przesyła.
TeslaTower=Wieża wysokiego napięcia. Pobiera dużą ilość prądu podczas pracy.
WindTurbine=Zamienia wiatr w energię elektryczną.
FractionatingColumn=Rozdziela mieszankę cieczy na frakcje.
IndustrialChemReactor=Przeprowadza reakcje chemiczne pomiędzy cieczami, gazami i ciałami stałymi.
Pumpjack_leg=Wydobywa ciecz ze znajdującego się pod nim złoża, jest napędzany energią kinetyczną.
RailStation=Załadowuje i rozładowuje pociągi. Pokazuje nazwę i rozkład jazdy pociągów z innych stacji.
DroneStation=Zasilana stacja bazowa dla dronów.
Portal=Droga z tego świata. Ostatnia rzecz, po którą buduje się fabrykę.
LogicInterface=Odczytuje i zapisuje sygnały sieci logicznej. Wiersze warunków decydują o tym, co wysyła.
LogicSensor=Odczytuje stan znajdującego się obok urządzenia i zamienia go na sygnał logiczny.
LogicWire=Przewód danych. Przenosi sygnały logiczne między urządzeniami, które łączy.

