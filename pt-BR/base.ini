GatherCopperOreDesc=Copper ore shows on the surface. Mine it with your multitool.
GatherCopperOreDesc2=A deposit close by shows on the compass at the top of the screen, and the map (<blue>{key:ToggleMap}</>) marks the deposits around you.
ObjGatherCopperOre=Mine {item:ChalcopyriteOre} or {item:MalachiteOre}
GatherFuel=Gather Fuel
GatherFuelDesc=Coal is mined like ore, logs come from trees. A furnace burns both.
ObjGatherCoal=Gather {count} × {item:CoalOre}
ObjGatherLogs=Gather {count} × {item:Log}
OpenInventory=Open Your Inventory
OpenInventoryDesc1=Open your inventory with <blue>{key:ToggleInventory}</>. What you carry is on the left, the item database is on the right.
OpenInventoryDesc2=Find an item in the database and order it. The same key closes the window.
ObjOpenInventory=Open the inventory with {key:ToggleInventory}
MineStone=Gather Stone
MineStoneDesc=Mine <blue>{item:StoneSurface}</> from rocks, boulders and cliff faces with your multitool.
ObjMineStone=Gather {item:StoneSurface}
ReturnHome=Back to the Base
ReturnHomeDesc1=Carry the ore back to the platform you started on: it holds the <blue>{item:LandingPad}</>, which you will need later.
ReturnHomeDesc2=The compass at the top of the screen points to the spawn, and <blue>{key:Escape}</> opens the menu with Teleport to Home.
ObjReturnHome=Walk back to the base
CraftFirstBlocks=Craft the Furnaces and the Smelter
CraftFirstBlocksDesc=Craft the <blue>{item:StoneFurnace}</> and the <blue>{item:StoneSmelter}</>. One furnace heats the smelter, another goes to the power plant.
ObjCraftStoneFurnace=Craft 2 × {item:StoneFurnace}
ObjCraftStoneSmelter=Craft a {item:StoneSmelter}
BuildFirstSmelter=Build Your First Smelter
BuildFirstSmelterDesc1=Choose a place with free space around it.
BuildFirstSmelterDesc2=Place a <blue>{item:StoneFurnace}</>. With the <blue>{item:StoneSmelter}</> in hand, aim at the furnace: the smelter docks onto its heat side.
ObjBuildStoneFurnace=Build a {item:StoneFurnace}
ObjStackStoneSmelter=Stand a {item:StoneSmelter} directly on the {item:StoneFurnace}
SmeltCopperPlates=Smelt Copper
SmeltCopperPlatesDesc1=Load fuel into the <blue>{item:StoneFurnace}</> and copper ore into the <blue>{item:StoneSmelter}</>.
SmeltCopperPlatesDesc2=Take the plates out of the smelter's output when it fills up.
ObjSmeltCopperPlates=Smelt {item:CopperPlate}
CraftMachines=From Heat to Research
CraftMachinesDesc=Craft a <blue>{item:CopperStirlingEngine}</>, a <blue>{item:CopperCompactGenerator}</> and a <blue>{item:CopperComputer}</>.
ObjCraftStirlingEngine=Craft a {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Craft a {item:CopperCompactGenerator}
ObjCraftComputer=Craft a {item:CopperComputer}
BuildFirstPowerPlant=Build the Power Plant
BuildFirstPowerPlantDesc1=Place the second <blue>{item:StoneFurnace}</>. Aim at it with the <blue>{item:CopperStirlingEngine}</> in hand, then dock the <blue>{item:CopperCompactGenerator}</> onto the engine and the <blue>{item:CopperComputer}</> onto the generator.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> switches between the docking positions. Load fuel into the furnace to start the plant.
ObjBuildPowerPlant=Join furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer} into one working line
AutomationChapter=Automation
ResearchBasicMachines=Open the Research Tree
ResearchBasicMachinesDesc1=Open the research tree with <blue>{key:Journal}</> or the research button on the left bar. The button also shows the time left on the running research.
ResearchBasicMachinesDesc2=Start {research:BasicMachines}. The computer produces its research points while it has electricity ; the recipes appear when the research is done.
ObjResearchBasicMachines=Research {research:BasicMachines}
ResearchAutomaticMining=Research Automatic Mining
ResearchAutomaticMiningDesc1={research:Automatization} unlocks the machines that move items between devices. {research:AutomaticMining} requires it and unlocks the {item:CopperDrillingRig}, which mines ore automatically.
ResearchAutomaticMiningDesc2=Keep fuel in the furnace while both run: the computer produces points only while it has power.
ObjResearchAutomatization=Research {research:Automatization}
ObjResearchAutomaticMining=Research {research:AutomaticMining}
BuildAutomaticMine=Set Up the Automatic Mine
BuildAutomaticMineDesc1=Find an ore deposit on the map, walk to it and stand a <blue>{item:CopperDrillingRig}</> on it.
BuildAutomaticMineDesc2=Place a <blue>{item:StoneFurnace}</> next to the rig and a <blue>{item:CopperStirlingEngine}</> on it. Connect the engine kinetic output to the rig kinetic input and load fuel into the furnace.
BuildAutomaticMineDesc3=Research {research:Chest} and place a <blue>{item:StoneChest}</> at the rig output side. Mined ore goes into the chest.
ObjPowerDrillingRig=Drive the {item:CopperDrillingRig} from a {item:CopperStirlingEngine} on a fuelled furnace
ObjDockMineChest=Stand a chest against the rig's output side
ObjCraftLineChests=Craft 2 {item:StoneChest}
ObjCraftLineHammer=Craft a {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Craft a {item:StoneSmelter}
ObjCraftLineEngine=Craft a {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Craft 2 {item:StoneFurnace}
CraftOreMultiplication=Multiply the Ore
CraftOreMultiplicationDesc1=A <blue>{item:StoneSmelter}</> gives 1 plate from 1 ore. The <blue>{item:CopperAutomaticHammer}</> crushes ore into impure gravel with a 50% {tips:Productivity} bonus, the <blue>{item:CopperMacerator}</> grinds the gravel into ore dust with another 50%. Smelting the dust gives about 2.25 plates from the same ore.
CraftOreMultiplicationDesc2=One hammer produces enough gravel for two macerators.
ObjCraftMultiplierMacerators=Craft 2 {item:CopperMacerator}
ObjCraftMultiplierArms=Craft 5 {item:CopperRobotArm}
ResearchCircuits=Research the Circuit
ResearchCircuitsDesc1=The next big step is your own circuit production: {research:CircuitBoard}, {research:Triod}, {research:Circuit}. {research:Constructor} unlocks a machine that crafts hand recipes automatically.
ObjResearchCircuitBoard=Research {research:CircuitBoard}
ObjResearchTriod=Research {research:Triod}
ObjResearchCircuit=Research {research:Circuit}
ObjResearchConstructor=Research {research:Constructor}

